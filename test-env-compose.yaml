services:
  http-server:
    build:
      context: .
      dockerfile: http-server-Dockerfile
    image: ao-tests-http-server
    ports:
      - "5080:5080"
    env_file: # Used for AWS bucket access
      - .env
    network_mode: bridge

  ftp-server:
    build:
      context: .
      dockerfile: ftp-server-Dockerfile
    image: ao-test-ftp-server
    ports:
      - "5021:5021"
      - "30000-30009:30000-30009"
    network_mode: bridge
